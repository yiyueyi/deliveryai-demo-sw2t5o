<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #fbf5ea 0%, #f3e6d0 100%);
        color: #211f1c;
      }
      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        margin: 0;
        letter-spacing: 0.02em;
      }
      p {
        margin-top: 0.75rem;
        color: #5f5b55;
        text-align: center;
      }
      .card {
        text-align: center;
        padding: 3rem 4rem;
        background: #fffdf8;
        border: 1px solid rgba(33, 31, 28, 0.06);
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(33, 31, 28, 0.08);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello World</h1>
      <p>你好，世界！这是我的第一个 HTML 页面。</p>
    </main>
  </body>
</html>
